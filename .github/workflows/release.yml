name: Release FlickerGuard

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: |
          bash -n release.sh
          shellcheck release.sh
          python3 scripts/check-release.py

  build:
    needs: validate
    runs-on: xcode-27
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash -n release.sh
          ruby -rpsych -e 'Psych.parse_file(".github/workflows/release.yml")'
          python3 - <<'PY'
          import os, pathlib, re
          version = pathlib.Path("Sources/FlickerGuard/Resources/Version.txt").read_text().strip()
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version)
          assert version == os.environ["RELEASE_TAG"]
          PY
          swift test
          python3 scripts/build-app.py
          codesign --verify --strict .build/FlickerGuard.app

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: .build/FlickerGuard.app.zip

      - name: Publish app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '[Download FlickerGuard.app.zip](https://github.com/tcrouzet/FlickerGuard/releases/download/%s/FlickerGuard.app.zip)\n\n' "$RELEASE_TAG" > .build/release-notes.md
          cat >> .build/release-notes.md <<'NOTES'
          Requires macOS 27 or later and Apple Silicon. Unzip the download, move FlickerGuard.app to Applications, and open it. Click the sun in the menu bar to enable dimming.

          Supports the built-in OLED displays of the 14-inch and 16-inch MacBook Pro with PROLED XDR.

          The app is not notarized by Apple. If macOS blocks the first launch, use System Settings → Privacy & Security → Open Anyway. Allow Accessibility access when activating brightness key control.

          Build provenance: gh attestation verify FlickerGuard.app.zip --repo tcrouzet/FlickerGuard
          NOTES
          gh release create "$RELEASE_TAG" .build/FlickerGuard.app.zip \
            --verify-tag --latest --title "FlickerGuard $RELEASE_TAG" --notes-file .build/release-notes.md
